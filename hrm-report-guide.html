<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HR Playbook 최종 결과보고서 작성 가이드</title>
<style>
:root{--navy:#1b2a4a;--gold:#b98a3d;--bg:#f5f6f9;--card:#fff;--fg:#1d2433;--muted:#5d6679;--line:#dde1ea;--tint:#f8f1e4;--ok:#2f7a55;--warn:#b4542d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.7;word-break:keep-all;overflow-wrap:anywhere}
header{background:var(--navy);color:#fff;padding:10px 16px;position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
header h1{font-size:16px;margin:0}header label{font-size:13px;display:flex;gap:6px;align-items:center}header select{font:inherit;font-size:14px;padding:3px 6px;border-radius:6px;border:0;max-width:220px}
.wrap{display:grid;grid-template-columns:230px 1fr;gap:16px;max-width:1150px;margin:0 auto;padding:16px}
nav{position:sticky;top:64px;align-self:start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;max-height:calc(100vh - 80px);overflow:auto}
nav button{display:block;width:100%;text-align:left;font:inherit;font-size:14px;border:0;background:none;padding:6px 10px;border-radius:8px;cursor:pointer;color:var(--fg)}nav button.on{background:var(--navy);color:#fff;font-weight:700}nav .grp{font-size:11.5px;color:var(--muted);font-weight:700;margin:8px 10px 2px}
#navsel{display:none;width:100%;font:inherit;padding:8px;border-radius:8px;border:1px solid var(--line);margin-bottom:10px}
main{min-width:0}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:14px}
h2{font-size:20px;margin:0 0 6px;color:var(--navy)}h3{font-size:16px;margin:18px 0 6px;color:var(--navy)}
.kc{border-left:4px solid var(--gold);background:var(--tint);padding:10px 14px;border-radius:8px;margin:10px 0}.kc.big{font-size:15.5px}
.hl{color:var(--warn);font-weight:700}.mini{font-size:13px;color:var(--muted)}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.badge{font-size:12.5px;border:1px solid var(--line);border-radius:999px;padding:1px 10px;background:#fff}.badge.g{border-color:var(--gold);color:#7c4a03;font-weight:700}
.toc{display:flex;flex-direction:column;gap:2px;margin:8px 0;padding:10px 14px;border:1px dashed var(--line);border-radius:8px}.toc em{font-style:normal;font-size:13px;color:var(--muted);margin-left:16px}
.sec{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}.sec>b{font-size:15.5px;color:var(--navy)}
.row{display:grid;grid-template-columns:92px 1fr;gap:4px 10px;margin-top:6px;font-size:14.5px}.row>span:first-child{font-size:12.5px;font-weight:700;color:var(--muted);padding-top:2px}
.tpl{background:#f2f5fa;border-radius:6px;padding:6px 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{font-size:13px;border:1px solid var(--gold);color:#7c4a03;border-radius:999px;padding:1px 10px;background:#fffaf0}
ul.self{list-style:none;padding:0;margin:6px 0}ul.self li{display:flex;gap:8px;align-items:flex-start;padding:3px 0}ul.self input{margin-top:6px;width:16px;height:16px}
details.st summary{cursor:pointer;color:var(--warn);font-weight:700;font-size:14px}details.st ul{margin:6px 0 0;padding-left:1.2rem;font-size:14px}
table.t{width:100%;border-collapse:collapse;font-size:14px}table.t th,table.t td{border-top:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}table.t th{font-size:12.5px;color:var(--muted)}.tw{overflow-x:auto}
ol.steps{padding-left:1.3rem;margin:6px 0}ol.steps li{margin:6px 0}.path{background:#eef2f8;border-radius:4px;padding:0 5px;font-size:13px}
.btn{display:inline-block;font:inherit;font-size:14px;font-weight:700;border:0;border-radius:8px;padding:6px 12px;background:var(--navy);color:#fff;text-decoration:none;cursor:pointer;margin:2px 6px 2px 0}.btn.g{background:var(--gold)}.msg{font-size:13px;color:var(--ok);font-weight:700}
.pn{display:flex;justify-content:space-between;gap:8px;margin-top:12px}
@media (max-width:760px){.wrap{grid-template-columns:1fr;padding:10px}nav{display:none}#navsel{display:block}.row{grid-template-columns:1fr;gap:0}.card{padding:14px}}
</style></head><body>
<header><h1>📘 HR Playbook 최종 결과보고서 작성 가이드</h1><label>우리 팀 <select id="tsel"></select></label><label>나는 <select id="msel"></select></label><span id="conn" style="font-size:12px;opacity:.85"></span></header>
<div class="wrap"><nav id="nav"></nav><main><select id="navsel"></select><div id="view"></div></main></div>
<script>
// HR Playbook 최종 결과보고서 — 장별 작성 가이드 데이터
var TEAMS=[
 {k:'t1',n:'마케팅2팀',co:'유니클로',job:'브랜드 마케터 (신입)',m:5,nm:["최근석", "한지우", "최지우", "한수빈", "이동헌"],note:'시즌 캠페인 기획 · 실행 업무가 기준'},
 {k:'t2',n:'데이터분석',co:'네이버',job:'데이터 분석 직무 신입',m:5,nm:["양호진", "우성민", "박준현", "서주영", "정현성"],note:'직무가 두 가지 섞여 있으면 Ⅳ장 쓰기 전에 하나로 정함'},
 {k:'t3',n:'재무회계',co:'이촌회계법인',job:'본점 신입 공인회계사 (감사)',m:5,nm:["박서윤", "이수제", "민서빈", "김현재", "유현아"],note:'감사조서 작성 · 계정 대사 업무가 기준'},
 {k:'t4',n:'마켓컬리팀',co:'나이키',job:'브랜드 마케팅 (신입)',m:4,nm:["정하람", "이재건", "강태민", "안지수"],note:'영업관리가 아니라 마케팅 직무로 통일'},
 {k:'t5',n:'미래선도',co:'CJ대한통운',job:'F/C(풀필먼트센터) 운영 신입',m:4,nm:["김유민", "배수현", "조명철", "김민준"],note:'직무가 두 가지 섞여 있으면 Ⅳ장 쓰기 전에 하나로 정함'},
 {k:'t6',n:'유통1팀',co:'쿠팡',job:'상품기획(MD) 신입',m:4,nm:["김영은", "이보은", "홍유나", "이재완"],note:'주간 발주안 업무가 기준 · 「마켓컬리 유통물류」 흔적은 지움'},
 {k:'t7',n:'밸류파인더',co:'한국투자증권',job:'리서치 애널리스트 신입(RA)',m:2,nm:["정우철", "김유찬"],note:'실적 추정 시트 업데이트 업무가 기준'}
];
// s: [절 제목, 찾을 것, 가져올 곳, 문장 틀({기업} {직무})]
var CH=[
 {n:'Ⅰ',t:'기업 개요와 경영 전략',w:1.25,ord:2,q:'우리 팀이 보는 회사는 어떤 회사이고, 어디로 가려 하며, 지금 어떤 사람들이 일하고 있나?',
  s:[['기업 개요','사업 내용 · 매출 규모 · 직원 수 · 조직 구성(본부 · 사업부) — 숫자마다 연도와 출처','사업보고서(전자공시 DART) 「사업의 내용」, 기업 홈페이지, 1~2주차 기업 분석','「{기업}은 (사업)을 하는 기업으로, (연도) 기준 매출 (값), 직원 (값)명이다(출처, 연도). (조직 구성)으로 운영된다.」'],
     ['경영 전략과 전략적 방향','비전 · 중장기 전략(신사업 · 해외 진출 · 디지털 전환 · ESG 등)과 최근 1~2년의 이슈 — 그래서 앞으로 어떤 일과 사람이 더 필요해지나','사업보고서 「사업의 내용」 · 투자설명(IR) 자료 · CEO 신년사 · 보도자료 · 기사 원문(날짜)','「{기업}은 (전략 방향)을 내세운다(출처, 연도). 최근 (이슈)가 있었다(출처, 날짜). 이 방향이라면 {직무}에게는 (일 · 역량)이 더 필요해진다.」'],
     ['인력 현황','직원 수와 구성(성별 · 정규직/기간제 · 신입/경력 채용 비중), 평균 근속연수, 이직률(기업이 공개한 공식 이직률 — 대상 · 기간 · 산식과 함께), 1인 평균 급여(전사 평균인지 신입 조건인지 표시) — 숫자마다 연도와 출처, 없으면 [확인 불가]','사업보고서 「직원 등의 현황」(근속연수 · 1인 평균 급여) · 지속가능경영(ESG) 보고서(공식 이직률) · 공공데이터포털 「국민연금 가입 사업장 내역」(가입자 증감 — 퇴사자 수와 같지 않음) · 채용 공고(신입/경력 비중) · 리뷰 사이트(참고용)','「{기업} 직원은 (값)명, 평균 근속연수 (값)년, 1인 평균 급여 (값)만 원이다(사업보고서, 연도). 이직률은 (값)%다(ESG 보고서, 연도 · 산식). 공식 이직률이 없으면 「국민연금 가입자 변동은 (값)명이다 — 납부예외 등이 섞여 퇴사자 수와 같지 않다」로 쓰거나 [확인 불가]. 이 숫자는 Ⅴ장 채용 · Ⅷ장 보상 · Ⅹ장 인재 유지에서 다시 쓴다.」']],
  fig:['표 Ⅰ-1 기업 개요 (사업 · 규모 · 전략 방향 · 출처) — 필수','표 Ⅰ-2 인력 지표 (직원 수 · 구성 · 근속 · 이직률 · 평균 급여 · 연도 · 출처) — 필수'],
  kw:['경영 전략 · 비전','사업보고서(DART)','평균 근속연수','이직률','1인 평균 급여'],
  self:['숫자마다 연도와 출처가 있다','홍보 문구가 아니라 사실과 숫자로 썼다','전략 방향 → 필요해지는 일 · 사람까지 이어진다','이직률은 공식 자료의 대상 · 기간 · 산식을 적었고, 국민연금 가입자 변동을 퇴사자 수로 바꿔 쓰지 않았다','없는 지표는 지어내지 않고 [확인 불가]'],
  st:['상장사가 아니라 공시가 없다 → 홈페이지 · 기사 · 국민연금 가입자 수(지표 이름 그대로) + [확인 불가]','외국계라 국내 자료가 적다 → 한국 법인 자료가 없으면 글로벌 자료 + 「(글로벌 기준)」 표시','리뷰 사이트 연봉은 공식 자료가 아니다 → 「참고(리뷰 사이트, 확인일)」로 구분']},
 {n:'Ⅱ',t:'경영 환경 — 산업과 국내외 경쟁사',w:1,ord:2,q:'이 회사는 누구와 어떤 판에서 경쟁하고 있고, 그래서 어떤 사람이 더 필요해지나?',
  s:[['산업 구조와 동향','산업의 크기 · 성장 추세 · 기술 · AI · 소비자 · 규제 변화 2가지','산업 보고서 · 통계청(KOSIS) · 협회 자료 · 기사','「(산업)은 (규모)이며 (추세)다(출처, 연도). 특히 (변화)가 산업을 바꾸고 있다.」'],
     ['국내외 경쟁사 비교','국내 경쟁사 2곳 · 해외 경쟁사 1곳과 비교한 우리 기업의 위치 — 규모 · 전략 · 인력 지표(직원 수 · 평균 급여 · 근속)도 나란히','경쟁사 사업보고서 · 홈페이지 · 해외 기업 연차보고서(Annual Report) · 기사','「{기업}은 국내에서 (경쟁사)와, 해외에서 (경쟁사)와 경쟁한다. (표 Ⅱ-1과 같이) {기업}은 (강점)은 앞서지만 (약점)은 뒤진다. 인재 확보에서도 (차이)가 있다.」'],
     ['더 필요해지는 인재','위 변화와 경쟁 구도 때문에 {직무}에게 더 필요해지는 역량과 줄어드는 일','산업 보고서 · 고용 전망 자료 · 2주차 미래 인재상 탐색','「(변화 · 경쟁)으로 (일)은 줄고 (일)은 늘고 있다(출처). 그래서 {직무}에게는 (역량)이 더 중요해졌다 — Ⅲ장 인재상의 근거.」']],
  fig:['표 Ⅱ-1 국내외 경쟁사 비교 (규모 · 전략 · 인력 지표 · 출처) — 필수','표 Ⅱ-2 산업 변화와 필요 역량 — 선택'],
  kw:['경영 환경','국내외 경쟁사','인재 확보 경쟁','미래 역량'],
  self:['국내 · 해외 경쟁사가 모두 있다','경쟁사와 같은 기준으로 비교했다 — 전사 평균 vs 신입 조건, 글로벌 본사 vs 국내 법인, 사업 경쟁사 vs 인재 확보 경쟁사, 기준 연도를 구분했다','변화 → 필요 역량으로 이어진다(변화만 나열하지 않았다)'],
  st:['산업 범위가 너무 넓다 → 우리 기업의 주력 사업 하나로 좁힘','해외 경쟁사 자료가 영어다 → Annual Report의 직원 수 · 매출만 찾아도 충분']},
 {n:'Ⅲ',t:'전략과 인재상',w:1,ord:2,q:'Ⅰ장의 전략과 Ⅱ장의 경쟁 환경을 보면, 이 회사는 어떤 사람을 원해야 하나? 지금 인재상은 그것과 맞나?',
  s:[['기업이 밝힌 인재상','채용 페이지의 인재상 원문 요약(키워드 3~4개)과 Ⅰ장 전략 방향과의 연결 — 전략이 요구하는 것이 인재상에 들어 있나','기업 채용 페이지 · 기업 소개 자료(확인일) · Ⅰ장 2절','「{기업}은 인재상으로 (키워드)를 내세운다(출처, 확인일). 이는 (전략 방향)과 (이어진다 / 어긋난다).」'],
     ['경쟁사 인재상과 비교','Ⅱ장 경쟁사 1~2곳의 인재상과 같은 점 · 다른 점','경쟁사 채용 페이지(확인일)','「(경쟁사)는 (키워드)를 강조한다. {기업}과 달리 (차이)가 있다.」'],
     ['우리 팀이 정의한 인재상','2주차 미래 인재상 · Ⅱ장 3절과 비교 → 우리 팀이 정의한 인재상 한 문장 + 근거','2주차 탐색 · Ⅰ · Ⅱ장','「회사의 인재상은 (A)를 강조하지만, (전략 · 경쟁 · 변화)를 보면 {직무}에게는 (B)도 필요하다. 그래서 우리 팀은 인재상을 ‘(한 문장)’으로 정의한다.」'],
     ['인재상의 개선 제안','판단 하나 — 유지(근거와 유지 조건) / 개선(확인된 문제 → 근거 → 개선안 → 기대 효과 · 확인 지표 · 불리해지는 사람) / 추가 확인(필요한 자료와 확인 방법). 억지로 문제를 만들지 않음','위 세 절 · 채용 공고 · 면접 질문','「{기업}은 인재상으로 (A)를 내세우지만, 공개된 채용 자료에서는 (A)를 확인하는 방법이 보이지 않는다(근거). 본 팀은 공고 · 면접 질문에 (반영 방법)을 넣는 방안을 제안한다. 확인은 (지표)로 한다.」']],
  fig:['표 Ⅲ-1 전략 → 기업 인재상 → 경쟁사 인재상 → 우리 팀 인재상 — 필수'],
