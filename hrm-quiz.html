var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(row * cellSize, col * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  //---------------------------------------------------------------------
  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }
  };

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

  //---------------------------------------------------------------------
  // qrcode.createStringToBytes
  //---------------------------------------------------------------------

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

  //---------------------------------------------------------------------
  // QRMode
  //---------------------------------------------------------------------

  var QRMode = {
    MODE_NUMBER :    1 << 0,
    MODE_ALPHA_NUM : 1 << 1,
    MODE_8BIT_BYTE : 1 << 2,
    MODE_KANJI :     1 << 3
  };

  //---------------------------------------------------------------------
  // QRErrorCorrectionLevel
  //---------------------------------------------------------------------

  var QRErrorCorrectionLevel = {
    L : 1,
    M : 0,
    Q : 3,
    H : 2
  };

  //---------------------------------------------------------------------
  // QRMaskPattern
  //---------------------------------------------------------------------

  var QRMaskPattern = {
    PATTERN000 : 0,
    PATTERN001 : 1,
    PATTERN010 : 2,
    PATTERN011 : 3,
    PATTERN100 : 4,
    PATTERN101 : 5,
    PATTERN110 : 6,
    PATTERN111 : 7
  };

  //---------------------------------------------------------------------
  // QRUtil
  //---------------------------------------------------------------------

  var QRUtil = function() {

    var PATTERN_POSITION_TABLE = [
      [],
      [6, 18],
      [6, 22],
      [6, 26],
      [6, 30],
      [6, 34],
      [6, 22, 38],
      [6, 24, 42],

    go.onclick = () => { go.disabled = true; const v = Object.assign({}, mine, { cia: [...pick] }); sentLocal[x.run + '_' + x.i] = v; push([{ k: 'a_' + x.run + '_' + x.i + '_' + uidGet(), v }]).catch(() => { go.disabled = false; go.textContent = '전송 실패 · 다시 누르기'; }); render(); };
    const w = el('div', 'nav'); w.append(go); bo.append(cia, w); s.append(bo);
  }
  function stuEnd(s, x) {
    const by = joinsBy(x.run); const tot = TEAMS.map(([k, nm]) => { let p = Object.values(x.ex || {}).filter((e) => e.team === k).length * 3; Q.forEach((_, qi) => { p += qTeam(qi, k, x.run, x.ex).pts; }); return [k, nm, Math.round(p)]; }).sort((a, b) => b[2] - a[2]);
    const mineT = tot.find((t) => t[0] === me.t) || [0, '', 0]; const r = 1 + tot.filter((t) => t[2] > mineT[2]).length;
    s.append(el('p', 'big', `🏁 끝! ${teamName(me.t)} ${mineT[2]}점 · ${r}위`));
    let c = 0; Q.forEach((q, qi) => { const a = live.f['a_' + x.run + '_' + qi + '_' + uidGet()]; if (a && a.th === q.th) c++; }); s.append(el('p', 'done1 ok', `나는 ${Q.length}문제 중 ${c}개 맞힘`)); const sendKey = 'P_' + x.run + '_' + uidGet(); const sent = live.f[sendKey];
    const sb = el('div', 'pickbar'); const sm = el('span', 'note', sent ? `✓ 교수님께 보냄 (${new Date(sent.at).toLocaleTimeString('ko-KR')})` : '아래 버튼을 눌러야 내 결과가 교수님께 갑니다.');
    const sbtn = el('button', 'btn go', sent ? '다시 보내기' : '교수님께 결과 보내기'); sbtn.type = 'button';
    let bc = 0; Q.forEach((q, qi) => { const a = live.f['a_' + x.run + '_' + qi + '_' + uidGet()]; if (a && ciaOk(q, a.cia)) bc++; });
    sbtn.onclick = () => { sbtn.disabled = true; sm.textContent = '보내는 중…'; push([{ k: sendKey, v: { n: me.n, t: me.t, correct: c, bonus: bc, team: teamName(me.t), teamPts: mineT[2], rank: r, at: Date.now() } }]).then(() => { sm.textContent = `✓ 교수님께 보냄 (${new Date().toLocaleTimeString('ko-KR')})`; sbtn.textContent = '다시 보내기'; sbtn.disabled = false; }).catch(() => { sm.textContent = '보내기 실패 — 와이파이 확인 후 다시 누르세요'; sbtn.disabled = false; }); };
    sb.append(el('b', null, '내 결과'), sbtn, sm); s.append(sb);
    const tw = el('div', 'tw'); const t = el('table', 'sum'); t.innerHTML = '<thead><tr><th>팀 · 장면</th><th>정답</th><th>왜</th><th>앵커 · 막는 장치</th></tr></thead>';
    const b = el('tbody'); Q.forEach((q) => { const tr = el('tr'); tr.append(el('td', null, q.team), el('td', null, q.th), el('td', null, q.def), el('td', null, q.ctl)); b.append(tr); }); t.append(b); tw.append(t); s.append(tw);
  }
  function stuJoin(s) {
    s.append(el('p', 'big', '입장 — 팀과 이름'));
    s.append(el('p', 'ask', '① 우리 팀 → ② 내 이름. 이 기록으로 팀 점수가 쌓입니다.'));
    let t = '', n = '';
    const tc = el('div', 'chips'); const nc = el('div', 'chips'); const inp = el('input', 'nmin'); inp.type = 'text'; inp.placeholder = '명단에 내 이름이 없으면 직접 입력';

    TEAMS.forEach(([k, nm]) => { const b = el('button', 'tg', nm); b.type = 'button'; b.setAttribute('aria-pressed', 'false'); b.onclick = () => { t = k; inp.value = ''; tc.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); fillN(); chk(); }; tc.append(b); });
    inp.oninput = () => { fillN(); chk(); };
    go.onclick = () => { me = { n: inp.value.trim(), t, run: null }; saveMe(); render(); };
    s.append(el('p', 'ask', '① 우리 팀'), tc, el('p', 'ask', '② 내 이름'), nc, inp);

  }
  // 학생 화면용 고르기 칸: 바구니 · 떨어질 때 톡 · 둥둥 톡
  function stuField(q, mode, onPick) {
    if (RM || mode === 'float') {
      const f = el('div', 'field' + (RM ? ' static' : ' late'));
      const chips = q.opts.slice().sort(() => Math.random() - 0.5).map((n) => { const b = el('button', 'kw', n); b.type = 'button'; b.onclick = () => { b.classList.add('on'); onPick(n); }; f.append(b); return b; });
      if (!RM) requestAnimationFrame(() => float(f, chips));
      return f;
    }
    const f = el('div', 'field rain late' + (mode === 'tap' ? ' tap' : '')); f.tabIndex = 0;
    let bk = null; if (mode === 'basket') { bk = el('div', 'basket'); bk.append(el('span', 'bkin', '')); f.append(bk); }
    requestAnimationFrame(() => rainS(f, bk, onPick, q.opts));
    return f;
  }
  function rainS(f, bk, onPick, opts) {
    const W = f.clientWidth, H = f.clientHeight; if (!W || !H) return;
    const BW = Math.min(170, Math.max(120, W * 0.32));
    let bx = W / 2; const placeB = () => { if (!bk) return; bx = Math.max(BW / 2, Math.min(W - BW / 2, bx)); bk.style.width = BW + 'px'; bk.style.left = (bx - BW / 2) + 'px'; }; placeB();
    if (bk) { const toX = (e) => { const r = f.getBoundingClientRect(); bx = e.clientX - r.left; placeB(); }; f.onpointermove = toX; f.onpointerdown = toX;
      keyH = (e) => { if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); bx += e.key === 'ArrowLeft' ? -W / 8 : W / 8; placeB(); } }; document.addEventListener('keydown', keyH); }
    const lanes = Math.max(2, Math.floor(W / 150)), LW = W / lanes;
    const queue = opts.slice().sort(() => Math.random() - 0.5);
    const drops = []; const speed = H / (bk ? 7 : 8); let nextAt = 0, last = performance.now();
    const spawn = () => {
      if (!queue.length) return;
      const busyL = new Set(drops.filter((d) => d.y < 90).map((d) => d.lane)); const free = [...Array(lanes).keys()].filter((l) => !busyL.has(l)); if (!free.length) return;
      const lane = free[Math.floor(Math.random() * free.length)], n = queue.shift();
      const b = el(bk ? 'span' : 'button', 'kw drop2', n); if (!bk) { b.type = 'button'; b.onclick = () => { b.classList.add('on'); onPick(n); }; } f.append(b);
      const w = b.offsetWidth, h = b.offsetHeight; const d = { n, b, w, h, lane, x: Math.min(Math.max(0, W - w), lane * LW + Math.max(0, (LW - w) / 2)), y: -h };
      b.style.left = d.x + 'px'; b.style.top = d.y + 'px'; drops.push(d);
    };
    const step = (t) => {
      if (!f.isConnected) return; const dt = Math.min(0.05, (t - last) / 1000); last = t;
      if (t >= nextAt) { spawn(); nextAt = t + 1100; }
      const top = bk ? H - bk.offsetHeight - 10 : 0;
      for (let i = drops.length - 1; i >= 0; i--) {
        const d = drops[i]; d.y += speed * dt; d.b.style.top = d.y + 'px';
        if (bk && d.y + d.h >= top && d.y + d.h <= top + 26 && Math.abs(d.x + d.w / 2 - bx) < BW / 2) { d.b.remove(); drops.splice(i, 1); bk.classList.add('got'); bk.firstChild.textContent = d.n; onPick(d.n); return; }
        if (d.y > H) { d.b.remove(); drops.splice(i, 1); queue.push(d.n); }
      }
      raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
  }
  // 다시 열었을 때: 지난 기록이 있으면 이어할지 새로 할지 먼저 묻기 (바로 끝 화면이 뜨지 않게)
  let resumeAsk = ROLE === 'host' && st && st.phase && st.phase !== 'intro';
  function resumeView(s) {
    const where = st.phase === 'end' ? '최종 순위까지 끝난 기록' : st.i >= 0 ? `Q${st.i + 1}까지 진행한 기록` : '입장·설명 단계까지 진행한 기록';

  }

  // ---------- 개념 먼저: 11/10 강의자료 「BARS 만들기」·「개념 6 평가오류 여섯 가지」 ----------
  function conceptCard(part) {

      const b = el('tbody'); [['5', '보정 근거와 결과를 매주 기록해 다음 시즌 발주 기준을 개선한다'], ['4', '(5와 3 사이)'], ['3', '기한 안에 내지만 추천 수량을 거의 그대로 쓴다'], ['2', '(3과 1 사이)'], ['1', '마감을 놓치거나 근거 없이 수량을 바꿔 결품 · 과재고를 낸다']].forEach(([a, c]) => { const tr = el('tr'); tr.append(el('td', 'n', a), el('td', null, c)); b.append(tr); }); t.append(b);
      const tw = el('div', 'tw'); tw.append(t); w.append(tw);
      const r = el('div', 'rules'); [['5점', '가장 잘한 사람이 실제로 한 행동'], ['3점', '대부분의 신입이 하는 행동'], ['1점', '다시 해야 했던 행동'], ['좋은 앵커 점검', '관찰할 수 있나? · 기록으로 확인되나? · 5 · 3 · 1이 같은 업무의 다른 수준인가?']].forEach(([a, c]) => { const d = el('div'); d.append(el('b', null, a), document.createTextNode(c)); r.append(d); }); w.append(r);
      w.append(el('p', 'note', '퀴즈: 우리 반 6팀 직무의 행동이 나옵니다 → 5 · 3 · 1점 중 어느 앵커인지 고르기'));
    } else {
      w.append(el('p', 'big', 'B. 평가오류 여섯 가지와 막는 장치'));
      w.append(el('p', 'done1 wait', '오류는 "조심하자"로는 못 막습니다. 평가 방법 · 기록 · 평가자 구성으로 막습니다.'));
      const t = el('table', 'res'); t.innerHTML = '<thead><tr><th>오류</th><th>무엇인가</th><th>막는 장치</th></tr></thead>';
      const b = el('tbody'); [['현혹효과 (후광)', '한 가지 인상이 다른 항목까지 번짐', '항목별로 따로 · BARS'], ['관대화 · 엄격화', '모두 후하게(박하게)', '등급 분포 확인 · 근거 기록'], ['중심화', '대부분 "보통"', '행동 앵커 · 수시 기록'], ['논리적 오류', '항목끼리 관련 있다고 믿음', '항목별 증거 따로 확인'], ['최근효과', '평가 직전 일만 크게 봄', '주간 기록 · 중간 피드백'], ['상동적 태도', '학교 · 성별 · 나이 등 고정관념', '다면평가 · 블라인드 항목']].forEach(([a, c, d]) => { const tr = el('tr'); tr.append(el('td', 'me', a), el('td', null, c), el('td', null, d)); b.append(tr); }); t.append(b);
      const tw = el('div', 'tw'); tw.append(t); w.append(tw);
      w.append(el('p', 'note', '퀴즈: 우리 반 팀 직무 장면 6개 → 오류 이름(10점) + 보너스로 막는 장치 하나(5점). 강의자료의 "오류 이름 1점 + 막는 장치 1점"과 같은 구조입니다.'));

    return w;
  }
  function conceptView(s, part) {
    s.append(conceptCard(part));
    const nav = el('div', 'nav');
    const go = el('button', 'btn go', part === 'A' ? 'A 퀴즈 시작 (1~6번) →' : 'B 퀴즈 시작 (7~12번) →'); go.type = 'button';

})();
